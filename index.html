@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

/* 14 gün */

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}

/* Planlar */
.trips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.act:nth-child(even){transform:rotate(1deg)}

.act[aria-pressed="true"]{background:var(--c);color:var(--on);transform:rotate(0) translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}

.act[aria-pressed="true"] .hearts{color:var(--on)}
.act .t{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.1}

.hearts{color:var(--heart);font-size:22px;letter-spacing:3px;line-height:1;white-space:nowrap}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.burst{position:absolute;top:-14px;right:-10px;background:var(--sun);color:var(--hero-ink);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;transform:rotate(8deg);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%) rotate(-1deg);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;z-index:30;max-width:calc(100% - 40px)}

}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function addDays(d,k){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);}
function diff(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function dm(s){var d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()];}
function longDay(s){var d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+WDL[d.getDay()];}
function sinceTxt(s){var d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]+FROM[d.getMonth()]+' beri';}
function range(a,b){var x=parse(a),y=parse(b);
  if(a===b) return dm(a);
  if(x.getMonth()===y.getMonth()&&x.getFullYear()===y.getFullYear()) return x.getDate()+'–'+y.getDate()+' '+MONTHS[y.getMonth()];
  return dm(a)+' – '+dm(b);}
function rel(ts){var m=Math.round((Date.now()-ts)/60000);

function upcoming(){var t=iso(today());return S.trips.filter(function(x){return x.end>=t;}).sort(function(a,b){return a.start.localeCompare(b.start);});}
function cityOn(ds){
  var t=iso(today());
  if(ds===t) return {city:S.city,sure:true};
  var tr=S.trips.find(function(x){return x.start<=ds&&x.end>=ds;});
  if(tr) return {city:tr.city,sure:true};

}
function normPhone(p){var d=String(p||'').replace(/\D/g,'');

/* ---------- GitHub bağlantısı ---------- */
var CONFIG = {owner:'', repo:''}; // Kendi alan adına taşırsan doldur: {owner:'kullanici', repo:'toprak-nerede'}
function repoInfo(){
  var h=location.hostname;
  if(/\.github\.io$/i.test(h)){var o=h.split('.')[0];var seg=location.pathname.split('/').filter(Boolean)[0];
    if(seg&&/\.html?$/i.test(seg)) seg='';
    return {owner:o,repo:seg||(o+'.github.io')};}
  return CONFIG.owner&&CONFIG.repo?CONFIG:null;
}
var REPO=repoInfo(), TOKEN_KEY='tn-gh-token', loginOpen=false;
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(_){return '';}}
function apiUrl(){return 'https://api.github.com/repos/'+REPO.owner+'/'+REPO.repo+'/contents/data.json';}
function ghHeaders(tok,raw){var h={'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(tok)h.Authorization='Bearer '+tok;return h;}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
function getJson(url,opts){return fetch(url,opts).then(function(r){if(!r.ok)throw {status:r.status};return r.json();});}
/* Arkadaşlar en güncel hali GitHub API'den okur (beklemesiz); olmazsa sitedeki data.json'a düşer. */
function loadState(){
  var tok=getToken();
  var viaApi = REPO ? getJson(apiUrl()+'?t='+Date.now(),{headers:ghHeaders(tok,true),cache:'no-store'}) : Promise.reject();
  return withTimeout(viaApi,5000).catch(function(){
    return withTimeout(getJson('data.json?t='+Date.now(),{cache:'no-store'}),5000);
  }).then(function(d){if(d&&d.city){S=d;S.trips=S.trips||[];S.activities=S.activities||[];}}).catch(function(){});
}
function b64(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
function putData(next,tok,retry){
  return fetch(apiUrl()+'?t='+Date.now(),{headers:ghHeaders(tok),cache:'no-store'}).then(function(r){
    if(r.status===404) return null; if(!r.ok) throw {status:r.status}; return r.json();
  }).then(function(cur){
    var body={message:'Durum: '+CITY[next.city].name+(next.note?' · '+next.note.slice(0,40):''),content:b64(JSON.stringify(next,null,2)+'\n')};
    if(cur&&cur.sha) body.sha=cur.sha;
    return fetch(apiUrl(),{method:'PUT',headers:Object.assign(ghHeaders(tok),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  }).then(function(r){
    if((r.status===409||r.status===422)&&!retry) return putData(next,tok,true);
    if(!r.ok) throw {status:r.status};
  });
}
function save(next){
  if(busy) return;
  var tok=getToken();
  if(!REPO||!tok){toast('Önce “Ben '+S.name+'’ım” ile giriş yap.');return;}
  next.trips=next.trips.filter(function(x){return x.start&&x.end;}).map(function(x){return x.end<x.start?{city:x.city,start:x.end,end:x.start,note:x.note||''}:x;});
  next.activities=next.activities.filter(function(a){return String(a.title).trim();});
  next.updated=Date.now();
  busy=true; document.querySelectorAll('#owner button,#save').forEach(function(b){b.disabled=true;});
  toast('Kaydediliyor…');
  putData(next,tok).then(function(){
    busy=false; S=JSON.parse(JSON.stringify(next)); draft=JSON.parse(JSON.stringify(next)); tab=S.city;
    setDirty(false); renderAll(); toast('Kaydedildi! Arkadaşların hemen görür.');
  },function(e){
    busy=false; document.querySelectorAll('#owner button,#save').forEach(function(b){b.disabled=false;});
    var st=e&&e.status;
    if(st===401||st===403){toast('Anahtar geçersiz ya da süresi dolmuş. Çıkış yapıp yenisiyle gir.');return;}
    if(st===404){toast('Repo bulunamadı. Anahtarın bu repoya izni var mı?');return;}
    toast('Kaydedilemedi. İnterneti kontrol edip tekrar dene.');
  });
}
function tryLogin(tok){
  if(!REPO){toast('Bu sayfa GitHub Pages’te değil. CONFIG içine repo bilgisini yaz.');return;}
  getJson('https://api.github.com/repos/'+REPO.owner+'/'+REPO.repo,{headers:ghHeaders(tok)}).then(function(info){
    if(!info.permissions||!info.permissions.push){toast('Bu anahtarın repoya yazma izni yok.');return;}
    try{localStorage.setItem(TOKEN_KEY,tok);}catch(_){}
    canEdit=true; loginOpen=false; draft=JSON.parse(JSON.stringify(S)); renderAll(); toast('Hoş geldin '+S.name+'!');
  }).catch(function(){toast('Giriş olmadı. Anahtarı kontrol et.');});
}
function renderLogin(){
  var el=document.getElementById('owner');
  if(canEdit) return;
  if(!loginOpen){el.hidden=true;return;}
  el.hidden=false; el.className='sec';
  el.innerHTML='<div class="panel sticker owner"><span class="tape label">Sadece '+esc(S.name)+' için</span>'+
   '<h2>Giriş yap</h2><p class="small">GitHub’da oluşturduğun anahtarı (token) yapıştır. Sadece bu telefonda saklanır, başka yere gönderilmez.</p>'+
   '<div class="field"><label for="gh-token">GitHub anahtarı</label><input id="gh-token" type="password" autocomplete="off" placeholder="github_pat_…"></div>'+
   '<div class="actions"><button type="button" class="btn primary is-'+S.city+'" id="login-go">Giriş yap</button><button type="button" class="btn" id="login-cancel">Vazgeç</button></div></div>';
}
function renderAll(){
  shell(); renderRoute(); renderHero(); renderStrip(); renderTrips(); renderActs();
  document.getElementById('meet-date').min=iso(today());
  try{var fn=localStorage.getItem('tn-friend'); if(fn) document.getElementById('friend-name').value=fn;}catch(_){}
  renderCompose();
  if(canEdit) renderOwner(); else renderLogin();
}

/* ---------- Olaylar ---------- */
function bind(){
  app.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    if(t.id==='me-btn'){say();return;}
    if(t.dataset.day){pickedDate=pickedDate===t.dataset.day?'':t.dataset.day;document.getElementById('meet-date').value=pickedDate;
      var co=pickedDate?cityOn(pickedDate):null; if(co&&co.city!==tab){tab=co.city;selected=null;renderActs();}
      renderStrip();renderCompose();return;}
    if(t.dataset.tab){tab=t.dataset.tab;renderActs();renderCompose();return;}
    if(t.dataset.act){selected=selected===t.dataset.act?null:t.dataset.act;renderActs();renderCompose();
      if(selected&&window.matchMedia('(max-width:560px)').matches) document.getElementById('compose-sec').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(t.id==='copy'){var m=buildMsg();
      try{navigator.clipboard.writeText(m).then(function(){toast('Mesaj kopyalandı!');},selectPreview);}catch(_){selectPreview();}return;}
    if(t.dataset.city){draft.city=t.dataset.city; if(S.city!==t.dataset.city) draft.since=iso(today()); save(draft);return;}
    if(t.id==='add-trip'){var s=document.getElementById('new-trip-start').value,en=document.getElementById('new-trip-end').value||s;
      if(!s){toast('Önce gidiş tarihini seç.');return;}
      draft.trips.push({city:document.getElementById('new-trip-city').value,start:s,end:en,note:''});
      draft.trips.sort(function(a,b){return a.start.localeCompare(b.start);}); setDirty(true); renderOwner(); openDetails(0);return;}
    if(t.dataset.delTrip!=null){draft.trips.splice(+t.dataset.delTrip,1);setDirty(true);renderOwner();openDetails(0);return;}
    if(t.id==='add-act'){draft.activities.push({id:'a'+Date.now().toString(36),title:'',place:'',city:tab,fav:1,note:''});setDirty(true);renderOwner();openDetails(1);
      var ins=document.querySelectorAll('#owner [data-f="title"]'); if(ins.length) ins[ins.length-1].focus(); return;}
    if(t.dataset.delAct!=null){draft.activities.splice(+t.dataset.delAct,1);setDirty(true);renderOwner();openDetails(1);return;}
    if(t.id==='save'){save(draft);return;}
    if(t.id==='login-open'){loginOpen=true;renderLogin();document.getElementById('owner').scrollIntoView({behavior:'smooth'});setTimeout(function(){var i=document.getElementById('gh-token');if(i)i.focus();},300);return;}
    if(t.id==='login-cancel'){loginOpen=false;renderLogin();return;}
    if(t.id==='login-go'){var v=document.getElementById('gh-token').value.trim();if(!v){toast('Önce anahtarı yapıştır.');return;}tryLogin(v);return;}
    if(t.id==='logout'){try{localStorage.removeItem(TOKEN_KEY);}catch(_){}canEdit=false;draft=null;setDirty(false);renderAll();toast('Çıkış yapıldı.');return;}
  });
  app.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='friend-name'||t.id==='meet-note'||t.id==='meet-date'){
      if(t.id==='friend-name'){try{localStorage.setItem('tn-friend',t.value);}catch(_){}}
      if(t.id==='meet-date'){pickedDate=t.value;renderStrip();}
      renderCompose();return;}
    if(!draft) return;
    if(t.dataset.g){draft[t.dataset.g]=t.value;setDirty(true);return;}
    if(t.dataset.t!=null){draft.trips[+t.dataset.t][t.dataset.f]=t.value;setDirty(true);return;}
    if(t.dataset.a!=null){var a=draft.activities[+t.dataset.a];a[t.dataset.f]=t.dataset.f==='fav'?+t.value:t.value;setDirty(true);return;}
  });
  app.addEventListener('change',function(e){var t=e.target;if(t.tagName==='SELECT'&&t.closest('#owner')){t.dispatchEvent(new Event('input',{bubbles:true}));}});
}
function openDetails(i){var d=document.querySelectorAll('#owner details');if(d[i])d[i].open=true;}
function selectPreview(){var p=document.getElementById('preview'),r=document.createRange();r.selectNodeContents(p);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast('Mesaj seçildi, kopyalayabilirsin');}

app.innerHTML='<div class="wrap"><div class="empty-box" style="margin-top:40px;text-align:center">'+esc(S.name)+' nerede, bakıyorum…</div></div>';
bind();
loadState().then(function(){
  tab=S.city;
  if(getToken()&&REPO){canEdit=true;draft=JSON.parse(JSON.stringify(S));}
  if(location.hash==='#duzenle'&&!canEdit) loginOpen=true;
  renderAll();
});
})();
</script>
</body>
</html>
